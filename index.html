
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160900">

<title>Naior Cafe | Digital Menu</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #160900;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 18px 10px;
    background: linear-gradient(135deg, #160900, #542600, #160900);
    border-bottom: 2px solid #d9a62e;
}

header h1 {
    color: #ffcf45;
    font-size: 30px;
    letter-spacing: 3px;
}

header p {
    color: #fff0bd;
    font-size: 11px;
    letter-spacing: 4px;
    margin-top: 5px;
}

.menu {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 10px;
}

.menu img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto 12px;
    border: 2px solid #d9a62e;
    border-radius: 8px;
    cursor: zoom-in;
}

footer {
    text-align: center;
    color: #ffcf45;
    padding: 18px 5px;
    font-size: 13px;
    letter-spacing: 2px;
    border-top: 1px solid #d9a62e;
}

/* Full screen image viewer */
.viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.97);
    align-items: center;
    justify-content: center;
    padding: 8px;
}

.viewer img {
    max-width: 100%;
    max-height: 95vh;
    object-fit: contain;
}

.close {
    position: absolute;
    top: 12px;
    right: 18px;
    color: white;
    font-size: 38px;
    cursor: pointer;
    z-index: 1001;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 25px;
    }

    .menu {
        padding: 5px;
    }

    .menu img {
        border-radius: 4px;
        margin-bottom: 8px;
    }
}
</style>
</head>

<body>

<header>
    <h1>NAIOR CAFE</h1>
    <p>SIP • RELAX • REPEAT</p>
</header>

<main class="menu">

    <img src="menu1.jpg"
         alt="Naior Cafe Menu Page 1"
         onclick="openImage(this.src)">

    <img src="menu2.jpg"
         alt="Naior Cafe Menu Page 2"
         onclick="openImage(this.src)">

</main>

<footer>
    GOOD FOOD ✦ GOOD MOOD
</footer>

<div class="viewer" id="viewer" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="fullImage" src="" alt="Full Menu"
         onclick="event.stopPropagation()">
</div>

<script>
function openImage(src) {
    document.getElementById("fullImage").src = src;
    document.getElementById("viewer").style.display = "flex";
}

function closeImage() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("fullImage").src = "";
}
</script>

</body>
</html>
