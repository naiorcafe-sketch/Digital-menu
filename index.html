
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160900">
<title>Naior Cafe | Digital Menu & Orders</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#160900;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:22px 10px;
 background:linear-gradient(135deg,#160900,#603000,#160900);
 border-bottom:2px solid #e6b83f;
}
header h1{color:#ffce49;font-size:32px;letter-spacing:3px}
header p{font-size:12px;letter-spacing:4px;margin-top:7px}
.menu{max-width:950px;margin:auto;padding:10px}
.menu img{
 width:100%;height:auto;display:block;
 border:2px solid #d9a62e;border-radius:7px;
 margin-bottom:12px;cursor:zoom-in;
}
.order{
 max-width:700px;margin:25px auto;
 padding:20px 15px;
 border:2px solid #d9a62e;
 border-radius:15px;
 background:linear-gradient(145deg,#301500,#130700);
}
.order h2{
 color:#ffce49;text-align:center;
 font-size:27px;margin-bottom:8px;
}
.sub{text-align:center;color:#e9d5a3;margin-bottom:22px}
label{display:block;margin:15px 0 7px;color:#ffce49;font-weight:bold}
input,select{
 width:100%;padding:13px;
 border-radius:8px;border:1px solid #c69a38;
 background:#fff;color:#222;font-size:16px;
}
button{
 border:0;border-radius:8px;padding:13px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.add{
 width:100%;margin-top:12px;
 background:#e9b936;color:#190b00;
}
.item{
 background:#4b290e;border:1px solid #b98b30;
 border-radius:8px;padding:12px;margin-top:10px;
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;
}
.item button{
 background:#a83220;color:white;padding:7px 12px;
}
.total{
 text-align:center;padding:18px;margin-top:18px;
 border-top:1px solid #d9a62e;
 color:#ffce49;font-size:25px;font-weight:bold;
}
.send{
 width:100%;background:#20bd61;color:white;
 margin-top:12px;font-size:18px;
}
.clear{
 width:100%;margin-top:8px;
 background:#65401d;color:white;
}
.hint{font-size:12px;color:#d9c7a0;margin-top:7px}
footer{
 text-align:center;padding:20px;
 color:#ffce49;letter-spacing:2px;
}
.viewer{
 display:none;position:fixed;inset:0;
 background:#000e;z-index:10;
 align-items:center;justify-content:center;padding:8px;
}
.viewer img{max-width:100%;max-height:95vh;object-fit:contain}
.close{
 position:absolute;top:12px;right:20px;
 font-size:40px;color:white;cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>NAIOR CAFE</h1>
<p>SIP • RELAX • REPEAT</p>
</header>

<!-- ORIGINAL MENU PHOTOS -->
<div class="menu">
<img src="menu1.jpg" alt="Naior Cafe Menu 1"
 onclick="openImage(this.src)">
<img src="menu2.jpg" alt="Naior Cafe Menu 2"
 onclick="openImage(this.src)">
</div>

<!-- ONLINE ORDER SECTION -->
<section class="order">

<h2>PLACE YOUR ORDER</h2>
<p class="sub">Good Food • Good Mood ❤️</p>

<label for="customer">Your Name</label>
<input id="customer" type="text"
 placeholder="Enter your name">

<label for="product">Select / Type Your Item</label>
<input id="product" list="items"
 placeholder="Search food or drink..."
 oninput="findPrice()">

<datalist id="items"></datalist>

<label>Price</label>
<input id="price" readonly placeholder="Automatic price">

<label for="qty">Quantity</label>
<input id="qty" type="number" min="1" value="1">

<button class="add" onclick="addItem()">
+ ADD TO ORDER
</button>

<p class="hint">
Select an item from the suggestions to get its price.
For pizza, select the required size.
</p>

<h3 style="color:#ffce49;margin-top:25px">
YOUR ORDER
</h3>

<div id="cart">
<p style="color:#c9b99c;margin-top:12px">
No items added yet.
</p>
</div>

<div class="total">
TOTAL: ₹<span id="total">0</span>
</div>

<button class="send" onclick="sendOrder()">
🟢 ORDER ON WHATSAPP
</button>

<button class="clear" onclick="clearOrder()">
CLEAR ORDER
</button>

<p class="hint" style="text-align:center;margin-top:14px">
Your order will be sent to Naior Cafe on WhatsApp.
</p>

</section>

<footer>
GOOD FOOD ✦ GOOD MOOD
</footer>

<!-- IMAGE ZOOM -->
<div class="viewer" id="viewer" onclick="closeImage()">
<span class="close">&times;</span>
<img id="fullImage" src="" alt="Full menu"
 onclick="event.stopPropagation()">
</div>

// LOAD ITEM SUGGESTIONS
const datalist = document.getElementById("items");

Object.keys(menu).forEach(name=>{
 const option=document.createElement("option");
 option.value=name;
 datalist.appendChild(option);
});

let cart=[];

function findPrice(){
 const name=document.getElementById("product").value;
 const price=document.getElementById("price");

 if(Object.prototype.hasOwnProperty.call(menu,name)){
   price.value="₹"+menu[name];
 }else{
   price.value="";
 }
}

function addItem(){
 const name=document.getElementById("product").value.trim();
 const qty=parseInt(document.getElementById("qty").value,10);

 if(!document.getElementById("customer").value.trim()){
   alert("Please enter your name first.");
   document.getElementById("customer").focus();
   return;
 }

 if(!Object.prototype.hasOwnProperty.call(menu,name)){
   alert("Please select a valid menu item from the suggestions.");
   return;
 }

 if(!Number.isInteger(qty)||qty<1){
   alert("Please enter a valid quantity.");
   return;
 }

 const existing=cart.find(item=>item.name===name);

 if(existing){
   existing.qty+=qty;
 }else{
   cart.push({name:name,price:menu[name],qty:qty});
 }

 document.getElementById("product").value="";
 document.getElementById("price").value="";
 document.getElementById("qty").value=1;

 showCart();
}

function showCart(){
 const area=document.getElementById("cart");
 area.innerHTML="";

 let total=0;

 if(cart.length===0){
   area.innerHTML='<p style="color:#c9b99c">No items added yet.</p>';
 }

 cart.forEach((item,index)=>{
   const amount=item.price*item.qty;
   total+=amount;

   const row=document.createElement("div");
   row.className="item";

   const info=document.createElement("span");
   info.textContent=item.name+" × "+item.qty+
     " = ₹"+amount;

   const remove=document.createElement("button");
   remove.textContent="Remove";
   remove.onclick=()=>{
     cart.splice(index,1);
     showCart();
   };

   row.append(info,remove);
   area.appendChild(row);
 });

 document.getElementById("total").textContent=total;
}

function sendOrder(){
 const customer=document.getElementById("customer").value.trim();

 if(!customer){
   alert("Please enter your name.");
   return;
 }

 if(cart.length===0){
   alert("Please add at least one item.");
   return;
 }

 let total=0;

 let message="*NEW ORDER - NAIOR CAFE*%0A";
 message+="--------------------------%0A";
 message+="Customer Name: "+encodeURIComponent(customer)+"%0A";
 message+="--------------------------%0A";

 cart.forEach(item=>{
   const amount=item.price*item.qty;
   total+=amount;

   message+=encodeURIComponent(item.name)+
     " x "+item.qty+
     " = Rs. "+amount+"%0A";
 });

 message+="--------------------------%0A";
 message+="*TOTAL: Rs. "+total+"*%0A";
 message+="Thank you!";

 const whatsappURL=
 "https://wa.me/919814252777?text="+message;

 window.open(whatsappURL,"_blank");
}

function clearOrder(){
 if(confirm("Clear your complete order?")){
   cart=[];
   document.getElementById("product").value="";
   document.getElementById("price").value="";
   document.getElementById("qty").value=1;
   showCart();
 }
}

// IMAGE ZOOM

function closeImage(){
 document.getElementById("viewer").style.display="none";
 document.getElementById("fullImage").src="";
}
